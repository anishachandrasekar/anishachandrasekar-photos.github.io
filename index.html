<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ================================================================
       SITE TITLE & DESCRIPTION
       These show in the browser tab, in Google, and in the preview card
       when you paste your link into WhatsApp / iMessage / LinkedIn.
       ================================================================ -->
  <title>Photographs</title>
  <meta name="description" content="A collection of things that stopped me in my tracks.">
  <meta property="og:title" content="Photographs">
  <meta property="og:description" content="A collection of things that stopped me in my tracks.">
  <!-- Optional: the image used in link previews. Point it at one of your photos. -->
  <meta property="og:image" content="images/img-7185.jpg">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%23222'/></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ================================================================
       HEADER — page links.
       ================================================================ -->
  <header class="site-header">
    <nav class="site-nav" aria-label="Main">
      <a href="index.html" aria-current="page">Photos</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main>
    <!-- Category filter buttons appear here automatically if your photos
         have a "category" (see photos.js). Otherwise it stays hidden. -->
    <div class="filters" id="filters" hidden></div>

    <!-- The gallery is built from the list in photos.js — no need to edit this. -->
    <section class="gallery" id="gallery" aria-label="Photographs"></section>
  </main>

  <!-- Full-screen photo viewer (built-in; no need to edit). -->
  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button class="lb-close" type="button" aria-label="Close">×</button>
    <button class="lb-prev" type="button" aria-label="Previous photo">‹</button>
    <figure class="lb-figure">
      <img class="lb-img" alt="">
      <figcaption class="lb-caption">
        <div class="lb-info">
          <span class="lb-title"></span>  <!-- title (bold) -->
          <span class="lb-place"></span>  <!-- City, Country -->
          <span class="lb-year"></span>   <!-- year -->
        </div>
        <span class="lb-count"></span>    <!-- 3 / 28 -->
      </figcaption>
    </figure>
    <button class="lb-next" type="button" aria-label="Next photo">›</button>
  </dialog>

  <!-- photos.js holds your photo list; gallery.js turns it into the page. -->
  <script src="photos.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
